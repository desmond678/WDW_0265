<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email"><br><br>
        <label for="phone">Phone</label>
        <input type="tel" id="phone"><br><br>
        <label for="date">Check-in Date:</label>
        <input type="date" id="date"><br><br>
        <label for="date">Check-out Date:</label>
        <input type="date" id="date"><br><br>
        <label  for="roomtype">Room type:</label>
        <select id="roomtype" required>
          <option value="">Select a room type</option>
          <option value="single">Single room</option>
          <option value="double">Double room</option>
          <option value="deluxe">Deluxe</option>
          <option value="double deluxe">Double deluxe</option></select><br><br>
        <label for="guests">Number of guests:</label>  
        <input type="number"><br><br>
        <label for="requests">Special Requests:</label><br>
        <textarea id="requests" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Submit Now">
        <input type="reset" value="Reset">
        </form>



    



    </form>
</body>
</html>
