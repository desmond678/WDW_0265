<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1 align="center">ABC College Admission 2026</h1>
    </header>
    <main>
        <h2>Courses and Fees</h2>
        <table border="1">
            <caption>Available Courses</caption>
            <thread>
                <tr>
                    <th>Courses</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thread>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60></td>
                <td>₹45,000</td>
            </tr>
            </table><br>
            <form>
                <fieldset>
                    <legend>Application Form</legend>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name"><br><br>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email"><br><br>
                    <label for="course">Course:</label><br>
                    <select id="course" name="course">
                        <option value="btech-cse">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select><br><br>
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="48"></textarea>
                    <br><br>
                    <button type="submit">Apply</button>
                </fieldset>
            </form>
    </main>
    <footer>
        <p align"center">© 2026 ABC College</p>
    </footer>
</body>
</html>
